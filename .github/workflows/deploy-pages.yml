name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Isolate API route outside workspace
        run: |
          BACKUP_PATH="$RUNNER_TEMP/portfolio_api_backup_${{ github.run_id }}_${{ github.run_attempt }}"
          if [ -e "$BACKUP_PATH" ]; then
            echo "::error::Backup path $BACKUP_PATH already exists. Aborting isolation to avoid overwriting."
            exit 1
          fi
          echo "API_BACKUP_DIR=$BACKUP_PATH" >> "$GITHUB_ENV"
          if [ -d "src/app/api" ]; then
            mkdir -p "$RUNNER_TEMP"
            mv src/app/api "$BACKUP_PATH"
          fi

      - name: Build static export for GitHub Pages
        env:
          BUILD_TARGET: github-pages
        run: npm run build

      - name: Restore API route to workspace
        if: always()
        run: |
          BACKUP_PATH="${API_BACKUP_DIR:-}"
          if [ -n "$BACKUP_PATH" ] && [ -d "$BACKUP_PATH" ]; then
            if [ -d "src/app/api" ]; then
              echo "::error::Conflict detected: Both $BACKUP_PATH and src/app/api exist. Halting restoration to prevent data loss."
              exit 1
            else
              mkdir -p src/app
              mv "$BACKUP_PATH" src/app/api
            fi
          fi

      - name: Verify static export output
        run: |
          if [ ! -f "out/index.html" ]; then
            echo "::error::Verification failed: out/index.html does not exist. Halting deployment."
            exit 1
          fi

      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
